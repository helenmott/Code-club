<!doctype html>
<!--
  The site itself lives in docs/ so that GitHub Pages can serve it directly
  when the Pages source folder is set to /docs.

  This file is only a safety net: if Pages is instead publishing from the
  repository root, it forwards visitors on to docs/ rather than 404ing.
  Harmless either way — when Pages serves /docs, this file is never reached.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Scotia &amp; PEI — 16-day family road trip</title>
<meta http-equiv="refresh" content="0; url=docs/">
<link rel="canonical" href="docs/">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center; text-align: center; padding: 24px;
    font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #fff; color: #10202e;
  }
  @media (prefers-color-scheme: dark) { body { background: #0c1620; color: #e8eef4; } }
  h1 { font-family: ui-serif, Georgia, serif; font-size: clamp(1.6rem, 5vw, 2.4rem); letter-spacing: -.02em; margin: 0 0 .4em; }
  p { margin: 0 0 1.4em; opacity: .75; }
  a {
    display: inline-block; padding: 11px 22px; border-radius: 999px;
    background: #14607d; color: #fff; text-decoration: none; font-weight: 620;
  }
  @media (prefers-color-scheme: dark) { a { background: #5cb4d4; color: #06131c; } }
</style>
</head>
<body>
  <main>
    <h1>Nova Scotia &amp; PEI</h1>
    <p>Taking you to the itinerary&hellip;</p>
    <a href="docs/">Open the trip</a>
  </main>
</body>
</html>
